name: Build frontend release
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/health_server.py', 'deploy/**', 'scripts/verify-build.cjs', '.github/workflows/build-frontend-release.yml']
  pull_request:
    paths: ['frontend/**', 'backend/health_server.py', 'deploy/**', 'scripts/verify-build.cjs', '.github/workflows/build-frontend-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BACKEND_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend
      - name: Stamp and verify production build
        run: node scripts/verify-build.cjs frontend .next --stamp
      - name: Package source and Linux runtime
        run: |
          tar --exclude='frontend/.next/cache' --exclude='frontend/public/contact' --exclude='frontend/.env*' --exclude='frontend/*.tsbuildinfo' -czf selfsite-frontend.tar.gz frontend backend/health_server.py deploy docs/guestbook-retirement-20261028.md scripts/verify-build.cjs .github/workflows/build-frontend-release.yml docs/deployment-4175.md
          sha256sum selfsite-frontend.tar.gz > selfsite-frontend.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: selfsite-frontend-${{ github.sha }}
          path: |
            selfsite-frontend.tar.gz
            selfsite-frontend.tar.gz.sha256
          retention-days: 14
