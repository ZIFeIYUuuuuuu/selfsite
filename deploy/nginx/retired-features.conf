# Included in the selfsite HTTPS server. Retire guestbook and music pages/APIs for every HTTP method.
location = /guestbook {
    add_header Cache-Control "no-store" always;
    return 410;
}

location ^~ /guestbook/ {
    add_header Cache-Control "no-store" always;
    return 410;
}

location = /api/v1/guestbook {
    add_header Cache-Control "no-store" always;
    return 410;
}

location ^~ /api/v1/guestbook/ {
    add_header Cache-Control "no-store" always;
    return 410;
}

location = /api/guestbook {
    add_header Cache-Control "no-store" always;
    return 410;
}

location ^~ /api/guestbook/ {
    add_header Cache-Control "no-store" always;
    return 410;
}

location = /api/audio {
    add_header Cache-Control "no-store" always;
    return 410;
}

location ^~ /api/audio/ {
    add_header Cache-Control "no-store" always;
    return 410;
}
